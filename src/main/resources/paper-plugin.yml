name: ${name}
version: ${version}
main: ${main}
api-version: "${apiVersion}"
# The update check runs on Paper's async/global-region schedulers and every
# command touches only its caller's thread, so the plugin is safe on Folia.
folia-supported: true
author: ${author}
description: ${description}
website: ${website}
# Paper's loader ignores Bukkit's legacy softdepend key (and without a declared
# relationship PlaceholderAPI's classes are invisible to this plugin), so the
# optional dependency is declared here: load after PAPI when it is present and
# join its classpath so the expansion classes resolve.
dependencies:
  server:
    PlaceholderAPI:
      load: AFTER
      required: false
      join-classpath: true
permissions:
  jflyspeed.other:
    description: Target other players with the speed commands (needs the matching speed permission too).
    default: op
  jflyspeed.flyspeed:
    description: Change fly speed via flyspeed and speed fly.
    default: op
  jflyspeed.walkspeed:
    description: Change walk speed via walkspeed and speed walk.
    default: op
  jflyspeed.reload:
    description: Reload the JFlySpeed configuration.
    default: op
  jflyspeed.version:
    description: View the JFlySpeed version.
    default: true
